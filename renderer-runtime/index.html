<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WpsAdbTool 3D Scene Runtime</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0c0e11;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        #hud-overlay {
            position: absolute;
            top: 12px;
            left: 12px;
            color: #94a3b8;
            font-size: 11px;
            pointer-events: none;
            line-height: 1.6;
            background: rgba(15, 23, 42, 0.75);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
        }
        #hud-overlay b {
            color: #38bdf8;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="hud-overlay">
        <div><b>Renderer:</b> Formal Scene Runtime (v1.0)</div>
        <div id="hud-status"><b>Status:</b> Initializing...</div>
        <div id="hud-scene"><b>Scene:</b> None</div>
    </div>
    <script type="module" src="./src/entry.ts"></script>
</body>
</html>
